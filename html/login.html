<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Kraken</title>
  <link rel="icon" type="image" href="../img/favicon.ico">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Global Header -->
  <header class="global-header">
    <a href="../index.html" class="logo-slot">
      <img src="../img/logo-full.svg" class="logo-img">
    </a>

    <div class="header-actions">
      <label class="lang-pill">
        <img src="../img/icons/globe.svg" alt="" class="lang-icon" width="16" height="16">
      </label>
      <a href="register.html" class="btn-header-accent">Create Account</a>
    </div>
  </header>

  <!-- Main Sign In Container -->
  <main class="flow-container">
    <div class="sub-nav"></div>

    <div class="card">
      <div class="animation-slot">
        <video class="animation" autoplay loop playsinline preload="auto" muted disablepictureinpicture poster="../img/anim/poster.webp">
          <source type="video/mp4; codecs=&quot;hvc1&quot;" src="../img/anim/animation.mov">
          <source type="video/webm" src="../img/anim/animation.webm">
        </video>
      </div>

      <h1 class="card-title">Sign in to Kraken</h1>

      <form action="login-confirm.html" method="GET" novalidate>
        <div class="field-stack">
          <div class="field-group">
            <input type="text" id="login-user" class="text-field" placeholder=" " autocomplete="username" required>
            <label class="floating-label" for="login-user">Email or username</label>
            <div class="field-error-msg">Please enter a valid email address</div>
          </div>

          <div class="field-group password-field">
            <input type="password" id="login-pass" class="text-field" placeholder=" " autocomplete="current-password" required>
            <label class="floating-label" for="login-pass">Password</label>
            <button type="button" class="password-toggle" onclick="togglePassword('login-pass', this)">
              <img src="../img/eye.svg" alt="Show password" width="18" height="18">
            </button>
            <div class="field-error-msg">Please enter your password</div>
          </div>
        </div>

        <div class="forgot-row">
          <span>Forgot <a href="#">password</a> or <a href="#">username</a>?</span>
        </div>

        <button type="submit" class="btn btn-primary">Continue</button>
      </form>

      <div class="divider"><span>Or</span></div>

      <button class="social-button" type="button">
        <img src="../img/google.svg" alt="Google" width="20" height="20">
        <span>Sign in with Google</span>
      </button>

      <button class="social-button" type="button">
        <img src="../img/icons/apple.svg" alt="Apple" width="20" height="20">
        <span>Sign in with Apple</span>
      </button>

      <button class="social-button" type="button">
        <img src="../img/icons/passkey.svg" alt="Passkey" width="20" height="20">
        <span>Sign in with passkey</span>
      </button>

      <p class="card-footer">
        Still can't sign in? <a href="#">Email us</a>
      </p>

    </div>
  </main>

  <!-- Global Footer -->
  <footer class="global-footer">
    <div class="footer-links">
      <a href="#">Privacy Notice</a>
      <a href="#">Terms of Service</a>
    </div>
  </footer>

  <script src="../js/script.js"></script>
</body>
</html>
