<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Kraken</title>
  <link rel="icon" type="image" href="../img/favicon.ico">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <header class="glavni-header">
    <a href="../index.html" class="polje-logotip">
      <img src="../img/logo-full.svg" class="image-logotip">
    </a>

    <div class="dejanja-header">
      <label class="jezikovni-button">
        <img src="../img/icons/globe.svg" alt="" class="icon-jezika" width="16" height="16">
      </label>
      <a href="register.html" class="button-header-poudarek">Create Account</a>
    </div>
  </header>

  <main class="glavni-vsebnik">
    <div class="pod-nav"></div>

    <div class="kartica">
      <div class="polje-animacija">
        <video class="animacija" autoplay loop playsinline preload="auto" muted disablepictureinpicture poster="../img/anim/poster.webp">
          <source type="video/mp4; codecs=&quot;hvc1&quot;" src="../img/anim/animation.mov">
          <source type="video/webm" src="../img/anim/animation.webm">
        </video>
      </div>

      <h1 class="naslov-kartice">Sign in to Kraken</h1>

      <form action="login-confirm.html" method="GET" novalidate>
        <div class="sklad-polj">
          <div class="skupina-polja">
            <input type="text" id="login-user" class="besedilno-polje" placeholder=" " autocomplete="username" maxlength="50" required>
            <label class="lebdeca-label" for="login-user">Email or username</label>
            <div class="sporocilo-napake">Please enter a valid email address</div>
          </div>

          <div class="skupina-polja polje-geslo">
            <input type="password" id="login-pass" class="besedilno-polje" placeholder=" " autocomplete="current-password" maxlength="50" required>
            <label class="lebdeca-label" for="login-pass">Password</label>
            <button type="button" class="preklop-gesla" onclick="preklopiGeslo('login-pass', this)">
              <img src="../img/eye.svg" alt="Show password" width="18" height="18">
            </button>
            <div class="sporocilo-napake">Please enter your password</div>
          </div>
        </div>

        <div class="vrstica-pozabljeno">
          <span>Forgot <a href="#" id="forgot-password">password</a> or <a href="#" id="forgot-username">username</a>?</span>
        </div>

        <button type="submit" class="button glavni-button">Continue</button>
      </form>

      <div class="locilnik"><span>Or</span></div>

      <button class="druzbeni-button" type="button">
        <img src="../img/google.svg" alt="Google" width="20" height="20">
        <span>Sign in with Google</span>
      </button>

      <button class="druzbeni-button" type="button">
        <img src="../img/icons/apple.svg" alt="Apple" width="20" height="20">
        <span>Sign in with Apple</span>
      </button>

      <button class="druzbeni-button" type="button">
        <img src="../img/icons/passkey.svg" alt="Passkey" width="20" height="20">
        <span>Sign in with passkey</span>
      </button>

      <p class="footer-kartice">
        Still can't sign in? <a href="#" data-ime="Email Us">Email Us</a>
      </p>

    </div>
  </main>

  <footer class="glavni-footer">
    <div class="povezave-footer">
      <a href="#">Privacy Notice</a>
      <span class="ovoj-pogojev"><a href="#" data-ime="Terms of Service">Terms of Servic</a><a href="#credits" class="skrite-zasluge">e</a></span>
    </div>
  </footer>

  <script src="../js/script.js"></script>
</body>
</html>
