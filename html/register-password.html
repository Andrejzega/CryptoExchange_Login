<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a password - MadeUpCompany</title>
  <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Global Header -->
  <header class="global-header">
    <a href="../index.html" class="logo-slot">
      <img src="../img/logo-full.svg" alt="MadeUpCompany" class="logo-img">
    </a>

    <div class="header-actions">
      <label class="lang-pill">
        <img src="../img/icons/globe.svg" alt="" class="lang-icon" width="16" height="16">
        <select class="lang-select">
          <option>English (US)</option>
          <option>Slovenščina</option>
          <option>Español</option>
          <option>Deutsch</option>
        </select>
        <svg class="lang-chevron" width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6l4 4 4-4"/>
        </svg>
      </label>
      <a href="login.html" class="btn-header-light">Sign in</a>
    </div>
  </header>

  <!-- Step 3: Choose Password -->
  <main class="flow-container">
    <div class="sub-nav">
      <a href="register-confirm.html" class="btn-back">‹ Back</a>
    </div>

    <div class="card">
      <div class="illustration-slot">
        <img src="../img/lock.svg" alt="Choose password" width="70" height="70">
      </div>

      <h1 class="card-title">Choose a password</h1>
      <p class="card-sub">Keep it unique to protect your account.</p>

      <form action="register-country.html" method="GET" novalidate>
        <div class="field-group password-group">
          <div class="password-field">
            <input type="password" id="step3-pass" class="text-field" placeholder=" " autocomplete="new-password" required>
            <label class="floating-label" for="step3-pass">Password</label>
            <button type="button" class="password-toggle" onclick="togglePassword('step3-pass', this)">
              <img src="../img/eye.svg" alt="Show password" width="18" height="18">
            </button>
          </div>
          <div class="field-error-msg">Password must fulfill all 4 security criteria</div>
          <!-- Requirements chips -->
          <div class="req-chips">
            <span class="chip" data-req="length"><span class="chip-icon">✕</span> 12 characters</span>
            <span class="chip" data-req="number"><span class="chip-icon">✕</span> 1 number</span>
            <span class="chip" data-req="special"><span class="chip-icon">✕</span> 1 special character</span>
            <span class="chip" data-req="letter"><span class="chip-icon">✕</span> 1 letter</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Continue</button>
      </form>
    </div>
  </main>

  <!-- Global Footer -->
  <footer class="global-footer">
    <div class="footer-links">
      <a href="#">Privacy Notice</a>
      <a href="#">Terms of Service</a>
    </div>
  </footer>

  <script src="../js/script.js"></script>
</body>
</html>
