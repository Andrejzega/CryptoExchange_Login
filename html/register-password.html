<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a password - Kraken</title>
  <link rel="icon" type="image" href="../img/favicon.ico">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <header class="glavni-header">
    <a href="login.html" class="polje-logotip">
      <img src="../img/logo-full.svg" class="image-logotip">
    </a>

    <div class="dejanja-header">
      <label class="jezikovni-button">
        <img src="../img/icons/globe.svg" alt="" class="icon-jezika" width="16" height="16">
      </label>
      <a href="login.html" class="button-header-svetel">Sign in</a>
    </div>
  </header>

  <main class="glavni-vsebnik">
    <div class="pod-nav">
      <a href="register-confirm.html" class="button-nazaj">‹ Back</a>
    </div>

    <div class="kartica">
      <div class="polje-image">
        <img src="../img/reg-lock.png">
      </div>

      <h1 class="naslov-kartice">Choose a password</h1>
      <p class="podnaslov-kartice">Keep it unique to protect your account.</p>

      <form action="register-country.html" method="GET" novalidate>
        <div class="skupina-polja skupina-geslo">
          <div class="polje-geslo">
            <input type="password" id="step3-pass" class="besedilno-polje" placeholder=" " autocomplete="new-password" minlength="12" maxlength="50" required>
            <label class="lebdeca-label" for="step3-pass">Password</label>
            <button type="button" class="preklop-gesla" onclick="preklopiGeslo('step3-pass', this)">
              <img src="../img/eye.svg" alt="Show password" width="18" height="18">
            </button>
          </div>
          <div class="sporocilo-napake">Password must fulfill all 4 security criteria</div>
          <div class="zahteve-znacke">
            <span class="znacka" data-req="length"><span class="icon-znacke">✕</span> 12 characters</span>
            <span class="znacka" data-req="number"><span class="icon-znacke">✕</span> 1 number</span>
            <span class="znacka" data-req="special"><span class="icon-znacke">✕</span> 1 special character</span>
            <span class="znacka" data-req="letter"><span class="icon-znacke">✕</span> 1 letter</span>
          </div>
        </div>

        <button type="submit" class="button glavni-button">Continue</button>
      </form>
    </div>
  </main>

  <footer class="glavni-footer">
    <div class="povezave-footer">
      <a href="#">Privacy Notice</a>
      <a href="#">Terms of Service</a>
    </div>
  </footer>

  <script src="../js/script.js"></script>
</body>
</html>
