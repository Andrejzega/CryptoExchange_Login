<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm your email - MadeUpCompany</title>
  <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Global Header -->
  <header class="global-header">
    <a href="../index.html" class="logo-slot">
      <img src="../img/logo-full.svg" alt="MadeUpCompany" class="logo-img">
    </a>

    <div class="header-actions">
      <label class="lang-pill">
        <img src="../img/icons/globe.svg" alt="" class="lang-icon" width="16" height="16">
        <select class="lang-select">
          <option>English (US)</option>
          <option>Slovenščina</option>
          <option>Español</option>
          <option>Deutsch</option>
        </select>
        <svg class="lang-chevron" width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6l4 4 4-4"/>
        </svg>
      </label>
      <a href="register.html" class="btn-header-accent">Create Account</a>
    </div>
  </header>

  <!-- Main Confirm Email Container -->
  <main class="flow-container">
    <div class="sub-nav">
      <a href="login.html" class="btn-back">‹ Back</a>
    </div>

    <div class="card">
      <div class="illustration-slot">
        <img src="../img/mail.svg" alt="Confirm email" width="70" height="70">
      </div>

      <h1 class="card-title">Confirm your email</h1>
      <p class="card-sub">Enter the 6-digit code sent to your email.</p>

      <form id="login-confirm-form" action="login.html" method="GET">
        <div class="otp-row" id="otp-boxes">
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-box" required autofocus>
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-box" required>
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-box" required>
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-box" required>
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-box" required>
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-box" required>
        </div>

        <div class="otp-action text-center">
          <button type="button" class="btn-link" onclick="pasteOTP('otp-boxes')">Paste from clipboard (123456)</button>
        </div>

        <!-- Confirm Page: ONLY Continue Button -->
        <button type="submit" class="btn btn-primary">Continue</button>
      </form>

      <p class="card-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>

    <p class="page-disclaimer">
      Confirming your email helps protect your account, allows password recovery, and ensures security alerts.
    </p>
  </main>

  <!-- Global Footer -->
  <footer class="global-footer">
    <div class="footer-links">
      <a href="#">Privacy Notice</a>
      <a href="#">Terms of Service</a>
    </div>
  </footer>

  <script src="../js/script.js"></script>
</body>
</html>
