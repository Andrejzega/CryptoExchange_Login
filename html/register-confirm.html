<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm your email - Kraken</title>
  <link rel="icon" type="image" href="../img/favicon.ico">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <header class="glavni-header">
    <a href="login.html" class="polje-logotip">
      <img src="../img/logo-full.svg"class="image-logotip">
    </a>

    <div class="dejanja-header">
      <label class="jezikovni-button">
        <img src="../img/icons/globe.svg" alt="" class="icon-jezika" width="16" height="16">
      </label>
      <a href="login.html" class="button-header-svetel">Sign in</a>
    </div>
  </header>

  <main class="glavni-vsebnik">
    <div class="pod-nav">
      <a href="register.html" class="button-nazaj">‹ Back</a>
    </div>

    <div class="kartica">
      <div class="polje-image">
        <img src="../img/mail.png">
      </div>

      <h1 class="naslov-kartice">Confirm your email</h1>
      <p class="podnaslov-kartice">Enter the 6-digit confirmation code sent to your email.</p>

      <form id="register-confirm-form" action="register-password.html" method="GET">
        <div class="vrstica-otp" id="otp-boxes">
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="polje-otp" required autofocus>
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="polje-otp" required>
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="polje-otp" required>
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="polje-otp" required>
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="polje-otp" required>
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="polje-otp" required>
        </div>

        <div class="vrstica-buttonov">
          <button type="button" class="button sekundarni-button">Resend code</button>
          <button type="submit" class="button glavni-button">Continue</button>
        </div>
      </form>

      <p class="footer-kartice">
        Already have a Kraken account? <a href="login.html">Sign in</a>
      </p>
    </div>

    <p class="opozorilo-strani">
      Confirming your email helps protect your account, allows password recovery, and ensures we can reach you with security alerts.
    </p>
  </main>

  <footer class="glavni-footer">
    <div class="povezave-footer">
      <a href="#">Privacy Notice</a>
      <a href="#">Terms of Service</a>
    </div>
  </footer>

  <script src="../js/script.js"></script>
</body>
</html>
