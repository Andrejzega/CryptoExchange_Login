<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm your email - Kraken</title>
  <link rel="icon" type="image" href="../img/favicon.ico">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Global Header -->
  <header class="global-header">
    <a href="../index.html" class="logo-slot">
      <img src="../img/logo-full.svg"class="logo-img">
    </a>

    <div class="header-actions">
      <label class="lang-pill">
        <img src="../img/icons/globe.svg" alt="" class="lang-icon" width="16" height="16">
      </label>
      <a href="login.html" class="btn-header-light">Sign in</a>
    </div>
  </header>

  <!-- Step 2: Email OTP Confirmation -->
  <main class="flow-container">
    <div class="sub-nav">
      <a href="register.html" class="btn-back">‹ Back</a>
    </div>

    <div class="card">
      <div class="image-slot">
        <img src="../img/mail.png">
      </div>

      <h1 class="card-title">Confirm your email</h1>
      <p class="card-sub">Enter the 6-digit confirmation code sent to your email.</p>

      <form id="register-confirm-form" action="register-password.html" method="GET">
        <div class="otp-row" id="otp-boxes">
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-box" required autofocus>
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-box" required>
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-box" required>
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-box" required>
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-box" required>
          <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-box" required>
        </div>

        <div class="btn-row">
          <button type="button" class="btn btn-secondary">Resend code</button>
          <button type="submit" class="btn btn-primary">Continue</button>
        </div>
      </form>

      <p class="card-footer">
        Already have a Kraken account? <a href="login.html">Sign in</a>
      </p>
    </div>

    <p class="page-disclaimer">
      Confirming your email helps protect your account, allows password recovery, and ensures we can reach you with security alerts.
    </p>
  </main>

  <!-- Global Footer -->
  <footer class="global-footer">
    <div class="footer-links">
      <a href="#">Privacy Notice</a>
      <a href="#">Terms of Service</a>
    </div>
  </footer>

  <script src="../js/script.js"></script>
</body>
</html>
