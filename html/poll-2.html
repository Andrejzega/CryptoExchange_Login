<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Verified - Kraken</title>
  <link rel="icon" type="image" href="../img/favicon.ico">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <header class="glavni-header">
    <a href="login.html" class="polje-logotip">
      <img src="../img/logo-full.svg" class="image-logotip">
    </a>

    <div class="dejanja-header">
      <label class="jezikovni-button">
        <img src="../img/icons/globe.svg" alt="" class="icon-jezika" width="16" height="16">
      </label>
      <a href="login.html" class="button-header-svetel">Sign out</a>
    </div>
  </header>

  <main class="glavni-vsebnik">
    <div class="pod-nav">
      <a href="poll-1.html" class="button-nazaj">‹ Back</a>
      <a href="../index.html" class="button-zapri" title="Exit">✕</a>
    </div>

    <div class="kartica besedilo-levo">
      <h1 class="mehki-naslov-kartice">Additional information</h1>
      <p class="podnaslov-kartice">Regulations require us to collect some additional info about you to continue trading on Kraken. <a href="#">Learn more</a></p>

      <form action="poll-3.html" method="GET">
        <h2 class="naslov-razdelka">How do you plan to use Kraken?</h2>
        <div class="seznam-izbir">
          <label class="potrditveni-element"><input type="checkbox" name="a1"> <span>Invest or trade crpyto</span></label>
          <label class="potrditveni-element"><input type="checkbox" name="a2"> <span>Invest or trade stocks</span></label>
          <label class="potrditveni-element"><input type="checkbox" name="a3"> <span>Peer-to-peer payments (P2P)</span></label>
          <label class="potrditveni-element"><input type="checkbox" name="a4"> <span>Futures trading</span></label>
          <label class="potrditveni-element"><input type="checkbox" name="a5"> <span>Margin trading</span></label>
          <label class="potrditveni-element"><input type="checkbox" name="a6"> <span>High-volume trading via OTC</span></label>
          <label class="potrditveni-element"><input type="checkbox" name="a7"> <span>I'm Still exploring</span></label>
        </div>

        <h2 class="naslov-razdelka">What are your sources of funds</h2>
        <div class="seznam-izbir">
          <label class="potrditveni-element"><input type="checkbox" name="a1"> <span>Salary</span></label>
          <label class="potrditveni-element"><input type="checkbox" name="a2"> <span>Business Proceeds</span></label>
          <label class="potrditveni-element"><input type="checkbox" name="a3"> <span>Retirement income or pension</span></label>
          <label class="potrditveni-element"><input type="checkbox" name="a4"> <span>Investments or inheritance</span></label>
          <label class="potrditveni-element"><input type="checkbox" name="a5"> <span>Other</span></label>
        </div>

        <label class="label-polja" for="poll-select-1">How much money do you expect to deposit and withdraw in a month?</label>
        <div class="skupina-polja">
          <select id="poll-select-1" class="besedilno-polje spustno-polje-brez-naslova izbirno-polje" required>
            <option value="" disabled selected></option>
            <option>Less than €1,000</option>
            <option>€1,000 - €9,999</option>
            <option>€10,000 - €99,999</option>
            <option>€100,000 - €999,999</option>
            <option>€1M or more</option>
          </select>
        </div>

        <label class="label-polja" for="poll-select-2">How many trades do you expect to make in a month?</label>
        <div class="skupina-polja">
          <select id="poll-select-2" class="besedilno-polje spustno-polje-brez-naslova izbirno-polje" required>
            <option value="" disabled selected></option>
            <option>Fewer than 10</option>
            <option>10-99</option>
            <option>100-999</option>
            <option>1,000 or more</option>

          </select>
        </div>

        <button type="submit" class="button glavni-button">Continue</button>
      </form>
    </div>
  </main>

  <footer class="glavni-footer">
    <div class="povezave-footer">
      <a href="#">Privacy Notice</a>
      <a href="#">Terms of Service</a>
    </div>
  </footer>

  <script src="../js/script.js"></script>
</body>
</html>
